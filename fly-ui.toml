app = 'healthline-ui'
primary_region = 'sjc'

[build]
  dockerfile = 'ui/Dockerfile'

[env]
  NODE_ENV = "production"
  NEXT_PUBLIC_DEPLOYMENT_MODE = "oss"
  NEXT_PUBLIC_AUTH_PROVIDER = "local"
  ENABLE_TELEMETRY = "false"

[http_service]
  internal_port = 3010
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
